[project]
name = "corpora-pdf-to-tf"
version = "0.0.0"
description = "Score-gated PDF to TEI to Text-Fabric conversion with located issue reports"
requires-python = ">=3.13"
dependencies = ["corpora-tei-to-tf", "lxml>=5,<7", "text-fabric==13.1.2"]

[project.scripts]
pdf-to-tf = "pdf_to_tf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_tf"]

[tool.uv.sources]
corpora-tei-to-tf = { path = "../tei-to-tf", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "lxml-stubs>=0.5"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["tf.*", "cfabric.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
