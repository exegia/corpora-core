[project]
name = "corpora-corpus-validate"
version = "0.0.0"
description = "Bounded corpus archive validation with real Text-Fabric and Context-Fabric loads"
requires-python = ">=3.13"
dependencies = ["text-fabric==13.1.2", "context-fabric==0.5.8", "lxml>=5,<7", "PyYAML>=6,<7"]

[project.scripts]
corpora-validate = "corpus_validate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_validate"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
