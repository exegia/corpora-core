[project]
name = "corpora-tf-ai-resolver"
version = "0.0.0"
description = "Audited AI proposals attached to exact Text-Fabric selections"
requires-python = ">=3.13"
dependencies = ["text-fabric==13.1.2", "context-fabric==0.5.8"]

[project.scripts]
tf-ai-resolver = "tf_ai_resolver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf_ai_resolver"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["tf.*", "cfabric.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
