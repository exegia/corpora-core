[project]
name = "corpora-epub-to-tf"
version = "0.0.0"
description = "Bounded local EPUB to Text-Fabric conversion"
requires-python = ">=3.13"
dependencies = ["text-fabric==13.1.2", "lxml==6.1.3"]

[project.scripts]
epub-to-tf = "epub_to_tf:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_to_tf"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "context-fabric==0.5.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_conversion.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["tf.*", "cfabric.*", "lxml.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
