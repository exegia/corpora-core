[project]
name = "corpora-tei-to-tf"
version = "0.0.0"
description = "Source-preserving TEI acquisition and Text-Fabric conversion"
requires-python = ">=3.13"
dependencies = ["lxml>=5,<7", "httpx>=0.28,<1", "text-fabric==13.1.2"]

[project.scripts]
tei-to-tf = "tei_to_tf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tei_to_tf"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2", "lxml-stubs>=0.5", "context-fabric==0.5.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["tf.*", "cfabric.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
