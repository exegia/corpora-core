name: EPUB and TF resolver
on:
  pull_request:
    paths:
      - 'packages/epub-to-tf/**'
      - 'packages/tf-ai-resolver/**'
      - 'crates/corpora-convert/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/epub-resolver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cargo build --locked -p corpora-convert --bin corpora-epub-check
      - name: Check EPUB package
        working-directory: packages/epub-to-tf
        run: |
          uv run --locked --group dev ruff format --check .
          uv run --locked --group dev ruff check .
          uv run --locked --group dev mypy src
          uv run --locked --group dev pytest -q
          uv build
      - name: Check TF resolver package
        working-directory: packages/tf-ai-resolver
        run: |
          uv run --locked --group dev ruff format --check .
          uv run --locked --group dev ruff check .
          uv run --locked --group dev mypy src
          uv run --locked --group dev pytest -q
          uv build
