[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Exegia <team@exegia.com>"]
homepage = "https://github.com/exegia/corpora-core"
repository = "https://github.com/exegia/corpora-core"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Performance lints
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"

# Style preferences (allow)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Workspace crates. `scripts/version.sh set` keeps each version equal to the
# workspace version; `cargo package` needs it on every path dependency.
corpora-core = { path = "crates/corpora-core", version = "0.2.0" }

# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Testing
insta = "1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[profile.test]
opt-level = 0
debug = true
