[package]
name = "corpora-core"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Exegia <team@exegia.com>"]
description = "Core library for the Corpora project"
documentation = "https://docs.rs/corpora-core"
readme = "README.md"
homepage = "https://github.com/exegia/corpora-core"
repository = "https://github.com/exegia/corpora-core"
license = "MIT OR Apache-2.0"
keywords = ["corpora"]
categories = ["development-tools"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "corpora_core"
path = "src/lib.rs"

[dependencies]
thiserror = "2"

[dev-dependencies]
insta = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Performance lints
redundant_clone = "warn"
large_enum_variant = "warn"
needless_collect = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"

# Style preferences (allow)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

[profile.test]
opt-level = 0
debug = true
