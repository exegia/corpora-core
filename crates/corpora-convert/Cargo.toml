[package]
name = "corpora-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Conversion runners for the Corpora apps suite"
documentation = "https://docs.rs/corpora-convert"
readme = "README.md"
keywords = ["corpora", "conversion", "tei", "epub"]
categories = ["development-tools"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[dependencies]
corpora-core = { path = "../corpora-core", features = ["serde"] }
roxmltree = "=0.21.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "corpora-epub-check"
path = "src/bin/epub_check.rs"

[lints]
workspace = true
